version: '3.8'

# ─────────────────────────────────────────────────────────────
#  k6 Observability Stack  —  InfluxDB v1  +  Grafana
#
#  WHY v1: k6's built-in --out influxdb only supports v1.x
#
#  Usage:
#    1. docker-compose up -d
#    2. k6 run --out influxdb=http://localhost:8086/k6 k6_e2e_load_test.js
# ─────────────────────────────────────────────────────────────

services:

  # ── InfluxDB v1.8 (native k6 support) ─────────────────────
  influxdb:
    image: influxdb:1.8
    container_name: k6-influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      INFLUXDB_DB:                k6
      INFLUXDB_HTTP_AUTH_ENABLED: "false"
    volumes:
      - influxdb-data:/var/lib/influxdb
    networks:
      - k6-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Grafana ────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.2.0
    container_name: k6-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED:  "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_USER:     admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - k6-net
    depends_on:
      influxdb:
        condition: service_healthy

volumes:
  influxdb-data:
  grafana-data:

networks:
  k6-net:
    driver: bridge
